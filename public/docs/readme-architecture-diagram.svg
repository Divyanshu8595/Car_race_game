<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <rect width="1200" height="320" rx="14" fill="#0A0B0E" stroke="#222631" stroke-width="2" />

  <text x="36" y="42" fill="#9CA3AF" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1.5">
