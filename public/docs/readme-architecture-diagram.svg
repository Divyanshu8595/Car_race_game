    <text x="20" y="34" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700">01 · DYNO SETUP LAB</text>
    <text x="20" y="58" fill="#F3F4F6" font-family="sans-serif" font-size="18" font-weight="700">Vehicle Configurator</text>
    <text x="20" y="88" fill="#9CA3AF" font-family="monospace" font-size="12">• Aero: Low / Bal / High</text>
    <text x="20" y="112" fill="#9CA3AF" font-family="monospace" font-size="12">• Gears: Sprint / Std / Tall</text>
    <text x="20" y="136" fill="#9CA3AF" font-family="monospace" font-size="12">• Tires: Soft / Endurance</text>
    <rect x="20" y="158" width="210" height="36" rx="6" fill="#0A0B0E" stroke="#222631" />
    <text x="32" y="180" fill="#D1D5DB" font-family="monospace" font-size="11">calculateTunedSpecs()</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g stroke="#E11D48" stroke-width="2" fill="none">
    <line x1="286" y1="175" x2="326" y2="175" />
    <polygon points="326,170 336,175 326,180" fill="#E11D48" stroke="none" />
  </g>

  <!-- Stage 2: Pure Physics Engine -->
  <g transform="translate(338, 68)">
    <rect width="265" height="214" rx="10" fill="#12141A" stroke="#E11D48" stroke-width="1.5" />
    <rect x="0" y="0" width="265" height="6" rx="3" fill="#E11D48" />
    <text x="20" y="34" fill="#E11D48" font-family="monospace" font-size="11" font-weight="700">02 · PURE PHYSICS CORE</text>
    <text x="20" y="58" fill="#F3F4F6" font-family="sans-serif" font-size="18" font-weight="700">stepRaceSimulation()</text>
    <text x="20" y="88" fill="#9CA3AF" font-family="monospace" font-size="12">• Clamped dt &lt;= 0.05s</text>
