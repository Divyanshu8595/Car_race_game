  <g transform="translate(655, 68)">
    <rect width="245" height="214" rx="10" fill="#12141A" stroke="#2A3040" stroke-width="1.5" />
    <rect x="0" y="0" width="245" height="6" rx="3" fill="#38BDF8" />
    <text x="20" y="34" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">03 · RIVAL AI POLICIES</text>
    <text x="20" y="58" fill="#F3F4F6" font-family="sans-serif" font-size="18" font-weight="700">updateOpponentAI()</text>
