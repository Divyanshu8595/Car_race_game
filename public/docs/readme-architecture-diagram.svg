    <rect width="212" height="214" rx="10" fill="#12141A" stroke="#2A3040" stroke-width="1.5" />
    <rect x="0" y="0" width="212" height="6" rx="3" fill="#10B981" />
    <text x="18" y="34" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">04 · PRESENTATION</text>
