    <text x="32" y="180" fill="#38BDF8" font-family="monospace" font-size="11">src/game/rules.ts (Tested)</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g stroke="#38BDF8" stroke-width="2" fill="none">
    <line x1="603" y1="175" x2="643" y2="175" />
    <polygon points="643,170 653,175 643,180" fill="#38BDF8" stroke="none" />
