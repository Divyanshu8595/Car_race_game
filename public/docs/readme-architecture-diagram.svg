    <text x="18" y="88" fill="#9CA3AF" font-family="monospace" font-size="12">• 36-Slice Road Proj</text>
    <text x="18" y="112" fill="#9CA3AF" font-family="monospace" font-size="12">• 128-Particle Pool</text>
    <text x="18" y="136" fill="#9CA3AF" font-family="monospace" font-size="12">• Web Audio Synth</text>
